services:
  orders-api:
    build:
      context: ./kubedeploy/app
    ports:
      - "8080:8080"
    environment:
      ORDERS_API_PORT: "8080"
      ORDERS_API_LOG_LEVEL: info

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./kubedeploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./kubedeploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - orders-api

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./kubedeploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./kubedeploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./kubedeploy/monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./kubedeploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: ec2,ecr,iam,sts,s3,dynamodb
      DEFAULT_REGION: us-east-1
