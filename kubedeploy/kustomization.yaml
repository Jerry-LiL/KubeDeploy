apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubedeploy
resources:
  - k8s/namespace.yaml
  - k8s/configmap.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingress.yaml
  - k8s/hpa.yaml
  - k8s/prometheus.yaml
  - k8s/grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/prometheus.yml
      - alerts.yml=monitoring/alerts.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=monitoring/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yml=monitoring/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-alerting
    files:
      - rules.yml=monitoring/grafana/provisioning/alerting/rules.yml
  - name: grafana-dashboard-orders
    files:
      - orders-api.json=monitoring/grafana/dashboards/orders-api.json
images:
  - name: orders-api
    newName: orders-api
    newTag: local
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: kubedeploy
